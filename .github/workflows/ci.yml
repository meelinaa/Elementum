name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Elementum.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore Elementum.slnx

      - name: Code Formatting Check (Warnings Non-Blocking)
        run: dotnet format --verify-no-changes --severity error
        continue-on-error: true

      - name: Build Solution (Release)
        run: dotnet build Elementum.slnx --configuration Release --no-restore

      - name: Run Test Suite
        run: dotnet test Elementum.slnx --configuration Release --no-build --verbosity normal
