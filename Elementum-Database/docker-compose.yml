# =============================================================================
# Docker Compose für Elementum (Datenbank + API)
# Start: docker compose up -d
# Stopp: docker compose down
# Ausführung: aus diesem Ordner (Elementum-Database)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL-Datenbankservice
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8
    container_name: elementum-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT}:3306"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Elementum-ServiceApi (ASP.NET Core)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../Elementum-Services
      dockerfile: Elementum-ServiceApi/Dockerfile
    container_name: elementum-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
