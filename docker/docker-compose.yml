# =============================================================================
# Docker Compose für Elementum (Datenbank + Redis + API + Worker)
# Start: docker compose up -d
# Stopp: docker compose down
# Ausführung: aus diesem Ordner (docker)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL-Datenbankservice
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8
    container_name: elementum-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT}:3306"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis (L2 Distributed Cache für HybridCache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: elementum-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Elementum.Api (ASP.NET Core)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../src
      dockerfile: Elementum.Api/Dockerfile
    container_name: elementum-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_ENVIRONMENT: Production
      # Production CORS: browser origins only. CLI/server callers are unaffected.
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN:-http://localhost:3000}"
      # TLS is terminated at the reverse proxy (profile "edge"), not in this container.
      ReverseProxy__TerminateHttps: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Elementum.Worker (Background worker)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ../src
      dockerfile: Elementum.Worker/Dockerfile
    container_name: elementum-worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-5094}:5094"
    env_file:
      - ../src/Elementum.Worker/.env
    environment:
      # Worker listens on this port (Program.cs uses configuration key "Urls")
      Urls: "http://+:${WORKER_PORT:-5094}"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Reverse proxy: HTTPS termination (Let's Encrypt / local TLS). API stays HTTP.
  # Start with: docker compose --profile edge up -d
  # ---------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: elementum-proxy
    restart: unless-stopped
    profiles: ["edge"]
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-https://localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
